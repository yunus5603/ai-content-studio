# Local development stack: Postgres + API + worker + web.
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studio
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/studio
      LOCAL_STORAGE_DIR: /media
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    volumes: [media:/media]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/studio
      LOCAL_STORAGE_DIR: /media
    command: uvicorn app.worker.main:app --host 0.0.0.0 --port 8080
    volumes: [media:/media]
    depends_on: [api]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_AUTH_MODE: dev
        NEXT_PUBLIC_ENABLE_DEBUG_OPERATIONS: "true"
    ports: ["3000:8080"]
    depends_on: [api]

volumes:
  pgdata:
  media:
