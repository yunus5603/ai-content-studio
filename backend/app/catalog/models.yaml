# Only loaded when ENABLE_DEBUG_OPERATIONS=true (local development and tests).
debug_models:
  - id: debug/pixel
    provider: debug
    model: pixel
    adapter: debug_pixel
    name: Debug pixel
    family: Debug
    media_type: image
    description: Returns a 1x1 image instantly. For testing the pipeline.
    operations:
      - operation: text_to_image
      - operation: image_edit
        inputs: [{ role: image, label: Reference images, min: 1, max: 4 }]
    params:
      - { name: n, label: Images, type: int, default: 1, min: 1, max: 4 }
      - { name: placeholder, label: Gradient placeholder, type: bool, default: false }
      - { name: fail, label: Fail on purpose, type: bool, default: false, advanced: true }
    pricing:
      unit: image
      quantity_param: n
      rates: [{ usd: 0.01 }]
      source: test
      verified: true

  - id: debug/clip
    provider: debug
    model: clip
    adapter: debug_clip
    name: Debug clip
    family: Debug
    media_type: video
    description: Simulates a 5-second video job and returns a test pattern clip (needs ffmpeg).
    operations:
      - operation: text_to_video
      - operation: image_to_video
        inputs: [{ role: first_frame, label: First frame, min: 1, max: 1 }]
    params:
      - name: duration_seconds
        label: Length
        type: enum
        default: 4
        options: [{ value: 4, label: 4 seconds }, { value: 8, label: 8 seconds }]
    pricing:
      unit: second
      seconds_param: duration_seconds
      rates: [{ usd: 0.01 }]
      source: test
      verified: true

# Studio-side steps that features submit as jobs (never shown in the model picker).
internal_models:
  - id: studio/stitch
    provider: studio
    model: ffmpeg
    adapter: stitch
    name: Storyboard assembly
    family: Studio
    media_type: video
    description: Joins storyboard clips into one video, in order, with cuts or crossfades.
    operations:
      - operation: assemble
        inputs: [{ role: clip, label: Clips, media_type: video, min: 1, max: 60 }]
    params:
      - name: transition
        label: Transition
        type: enum
        default: cut
        options: [{ value: cut, label: Hard cut }, { value: fade, label: Crossfade }]
      - { name: fade_seconds, label: Crossfade length, type: float, default: 0.5, min: 0.1, max: 2, when: { transition: [fade] } }
    pricing:
      unit: image
      rates: [{ usd: 0 }]
      source: Runs on our own worker; free to customers.
      verified: true
