[project]
name = "studio-backend"
version = "0.1.0"
description = "AI Content Studio API and worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "pydantic[email]>=2.7",
  "python-multipart>=0.0.9",
  "firebase-admin>=6.5",
  "google-cloud-storage>=2.17",
  "google-auth>=2.30",
  "httpx>=0.27",
  "pyyaml>=6.0.4",
  "openai>=3.60.0",
  "google-genai>=3.6.1",
  "stripe>=17.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
